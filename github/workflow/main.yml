name: Calculator CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Check HTML File
      run: test -f index.html

    - name: Check CSS File
      run: test -f style.css

    - name: Check JavaScript File
      run: test -f script.js

    - name: Success Message
      run: echo "Pipeline Successful"